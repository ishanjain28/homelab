chip "acpitz-*"
  ignore temp1

chip "it8688-*"
  label temp1 "System 1"
  label temp4 "PCIe x16"
  label temp5 "VRM MOS"
  label temp6 "PCH"

  label fan3 "System Fan 2"
  label fan4 "PCH Fan"

  ignore temp2
  ignore temp3

  ignore fan1
  ignore fan2
  ignore fan5

chip "it8792-*"
  label temp1 "PCIe x8"
  label temp3 "System 2"

  label fan1 "System Fan 5"
  label fan3 "System Fan 4"

  ignore temp2

  ignore fan2
