protocol bgp ifog {
  local as 199347;
  neighbor 2a0c:9a40:1072::1 as 34927;
  source address 2a0c:9a40:1072::457;
  graceful restart on;
  multihop 2;
  ipv6 {
    import none;
    export where source = RTS_STATIC;
  };
}

