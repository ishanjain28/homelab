name: dns
on:
  push:
    branches:
      - master
    paths:
      - .gitea/workflows/dns.yml
      - flake.nix
      - flake.lock
      - lib/**
      - packages/dns/**
      - secrets/dns/**
      - systems/**
      - tools/dns/**
jobs:
  push:
    runs-on: nixos
    steps:
      - uses: actions/checkout@v4
      - run: nix run .#dns -- push
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
