name: update flakes
on:
  schedule:
    - cron: "17 22 * * 5"
  workflow_dispatch:
jobs:
  update:
    runs-on: nixos
    steps:
      - uses: actions/checkout@v4
      - name: Update
        run: |
          set -euo pipefail
          nix flake update 2>&1 | tee "$RUNNER_TEMP/flake-update.log"
      - name: Evaluate
        run: |
          set -euo pipefail
          for host in $(nix eval --raw .#nixosConfigurations --apply 'h: toString (builtins.attrNames h)'); do
            echo "evaluating $host"
            nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
            echo
          done
          nix eval --raw .#packages.x86_64-linux --apply 'ps: toString (map (p: p.drvPath) (builtins.attrValues ps))'
      - name: Commit
        run: |
          set -euo pipefail
          if git diff --quiet flake.lock; then
            echo "flake.lock unchanged"
            exit 0
          fi
          git config user.name gitea-actions
          git config user.email gitea-actions@localhost
          { printf 'update flakes\n\n'; cat "$RUNNER_TEMP/flake-update.log"; } | git commit -F - flake.lock
          git push origin "HEAD:${{ gitea.ref_name }}"
